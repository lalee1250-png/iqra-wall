
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 مسابقة إقرأ</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#f0f4f8;color:#333;min-height:100vh}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:2rem;text-align:center;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.1) 0%,transparent 70%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.header h1{font-size:2.5rem;font-weight:800;position:relative;z-index:1;text-shadow:0 2px 10px rgba(0,0,0,.2)}
.header p{font-size:1.1rem;opacity:.9;margin-top:.5rem;position:relative;z-index:1}
.container{max-width:1200px;margin:0 auto;padding:1.5rem}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
.stat-card{background:#fff;border-radius:16px;padding:1.5rem;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.08);transition:transform .3s}
.stat-card:hover{transform:translateY(-5px)}
.stat-icon{font-size:2.5rem;margin-bottom:.5rem}
.stat-number{font-size:2.5rem;font-weight:800;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{color:#666;font-size:.9rem;margin-top:.3rem}
.form-section{background:#fff;border-radius:16px;padding:2rem;box-shadow:0 4px 15px rgba(0,0,0,.08);margin-bottom:2rem}
.form-section h2{font-size:1.5rem;margin-bottom:1.5rem;color:#667eea;display:flex;align-items:center;gap:.5rem}
.form-group{margin-bottom:1.2rem}
.form-group label{display:block;margin-bottom:.5rem;font-weight:600;color:#444}
.form-group input,.form-group select{width:100%;padding:.8rem 1rem;border:2px solid #e0e0e0;border-radius:10px;font-family:'Tajawal';font-size:1rem;transition:border-color .3s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#667eea}
.file-upload{border:2px dashed #ccc;border-radius:10px;padding:2rem;text-align:center;cursor:pointer;transition:all .3s}
.file-upload:hover{border-color:#667eea;background:#f8f9ff}
.file-upload input{display:none}
.btn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:.8rem 2rem;border-radius:10px;font-family:'Tajawal';font-size:1rem;font-weight:600;cursor:pointer;transition:all .3s;width:100%}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(102,126,234,.4)}
.filter-tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
.filter-tab{padding:.5rem 1.2rem;border-radius:20px;border:2px solid #e0e0e0;background:#fff;cursor:pointer;font-family:'Tajawal';font-weight:600;transition:all .3s}
.filter-tab.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:transparent}
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.participant-card{background:#fff;border-radius:16px;padding:1.5rem;box-shadow:0 4px 15px rgba(0,0,0,.08);transition:all .3s;position:relative;overflow:hidden}
.participant-card:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,0,0,.12)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.grade-badge{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:.3rem .8rem;border-radius:15px;font-size:.8rem;font-weight:600}
.delete-btn{background:none;border:none;color:#e74c3c;cursor:pointer;font-size:1.2rem;opacity:.6;transition:opacity .3s}
.delete-btn:hover{opacity:1}
.participant-name{font-size:1.2rem;font-weight:700;margin-bottom:.5rem}
.participant-class{color:#666;font-size:.9rem}
.participant-files{margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap}
.file-tag{background:#f0f4f8;padding:.3rem .8rem;border-radius:8px;font-size:.8rem;display:flex;align-items:center;gap:.3rem}
.empty-state{text-align:center;padding:3rem;color:#999}
.empty-state .icon{font-size:4rem;margin-bottom:1rem}
.export-section{margin-top:2rem;text-align:center}
.export-btn{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;border:none;padding:.8rem 2rem;border-radius:10px;font-family:'Tajawal';font-size:1rem;font-weight:600;cursor:pointer;transition:all .3s}
.export-btn:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(39,174,96,.4)}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#27ae60;color:#fff;padding:1rem 2rem;border-radius:10px;font-weight:600;z-index:1000;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateX(-50%) translateY(100px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.footer{text-align:center;padding:2rem;color:#999;margin-top:2rem}
@media(max-width:600px){.header h1{font-size:1.8rem}.stats-grid{grid-template-columns:repeat(2,1fr)}.wall-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="header">
<h1>📖 مسابقة إقرأ</h1>
<p>حائط المشاركين الإلكتروني</p>
</div>

<div class="container">

<!-- Stats -->
<div class="stats-grid">
<div class="stat-card"><div class="stat-icon">👥</div><div class="stat-number" id="totalParticipants">0</div><div class="stat-label">إجمالي المشاركين</div></div>
<div class="stat-card"><div class="stat-icon">📄</div><div class="stat-number" id="totalFiles">0</div><div class="stat-label">ملفات مرفوعة</div></div>
<div class="stat-card"><div class="stat-icon">🖼️</div><div class="stat-number" id="totalImages">0</div><div class="stat-label">صور مرفوعة</div></div>
<div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-number" id="topClass">-</div><div class="stat-label">الأكثر مشاركة</div></div>
</div>

<!-- Registration Form -->
<div class="form-section">
<h2>📝 تسجيل مشارك جديد</h2>
<div class="form-group">
<label>اسم الطالبة</label>
<select id="studentName"><option value="">اختر اسم الطالبة...</option></select>
</div>
<div class="form-group">
<label>الصف</label>
<select id="gradeSelect" onchange="updateStudentList()">
<option value="">اختر الصف...</option>
<option value="Second 1">الصف Second 1</option>
<option value="Second 2">الصف Second 2</option>
</select>
</div>
<div class="form-group">
<label>صورة شخصية (اختياري)</label>
<div class="file-upload" onclick="document.getElementById('photoInput').click()">
<input type="file" id="photoInput" accept="image/*" onchange="handleFile(this,'photo')">
<span id="photoLabel">اضغط لاختيار صورة 📷</span>
</div>
</div>
<div class="form-group">
<label>ملف المشاركة (اختياري)</label>
<div class="file-upload" onclick="document.getElementById('fileInput').click()">
<input type="file" id="fileInput" onchange="handleFile(this,'file')">
<span id="fileLabel">اضغط لاختيار ملف 📎</span>
</div>
</div>
<button class="btn" onclick="addParticipant()">➕ إضافة المشارك</button>
</div>

<!-- Filter Tabs -->
<div class="filter-tabs">
<button class="filter-tab active" onclick="filterWall('all',this)">الكل</button>
<button class="filter-tab" onclick="filterWall('Second 1',this)">الصف Second 1</button>
<button class="filter-tab" onclick="filterWall('Second 2',this)">الصف Second 2</button>
</div>

<!-- Participant Wall -->
<div class="wall-grid" id="wallGrid">
<div class="empty-state" id="emptyState">
<div class="icon">📚</div>
<p>لم يتم تسجيل أي مشارك بعد</p>
</div>
</div>

<!-- Export -->
<div class="export-section">
<button class="export-btn" onclick="exportStats()">📊 تصدير الإحصائيات</button>
</div>

</div>

<div class="footer">📖 مسابقة إقرأ © 2024</div>

<script>
const students={
'Second 1':['أسيل علي سعيد الفريدي','دره محمود محمد الأمين الطالب','مودة فيصل بن زميل المغذوي','جمانة حميد بن دكيل الله البلوي','جوري عبد المجيد بن عياد الجهني','جمان محمد أيمن عاشور','جوري محمد بن سعد الصاعدي','بثينة عبد الرحمن بن عطية السهلي','كادية فهد بن مصلح العوفي','غدي عبد الإله محمد الحربي','سولاف موسى بن منور الجهني','وريث أحمد الجهني','جنى محمد المغذوي','رقية أحمد عبد العزيز الحجيلي','سمر بندر سعيد محمد','رهف عبدالله','ساره عبد الله بن أحمد الأحمدي','غنى سمير','حسناة عمر','وتين عاطف بن عبد الله','مسره محمود محمد الأمين الطالب','نوف مطلق الحربي','وصايف فهد بن حمدان العوفي','ساره صويح واصل البركاتي','ريناد أحمد مرهي السهلي','غنى راشد الجهني','رفيق إبراهيم بن رزق الله السقافي','ساره عدنان','لين عبدالله العوفي'],
'Second 2':['ريم عبدالله بن سعود العوفي','دانة خالد بن صالح العوفي','لجين محمد بن ناصر الحربي','فاطمة علي بن سالم الغامدي','نورة عبدالرحمن بن فهد الدوسري','سارة محمد بن عبدالعزيز القحطاني','هند فهد بن سلطان العتيبي','مريم عبدالله بن صالح المطيري','عائشة خالد بن محمد الشمري','لمى سعود بن ناصر الحربي']
};

let participants=JSON.parse(localStorage.getItem('iqra_participants')||'[]');
let currentFilter='all';

function updateStudentList(){
const g=document.getElementById('gradeSelect').value;
const sel=document.getElementById('studentName');
sel.innerHTML='<option value="">اختر اسم الطالبة...</option>';
if(g&&students[g]){students[g].forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o)})}
}

function handleFile(input,type){
if(input.files.length){document.getElementById(type==='photo'?'photoLabel':'fileLabel').textContent=input.files[0].name}
}

function addParticipant(){
const name=document.getElementById('studentName').value;
const grade=document.getElementById('gradeSelect').value;
if(!name||!grade){alert('يرجى اختيار الصف واسم الطالبة');return}
const photo=document.getElementById('photoInput').files[0];
const file=document.getElementById('fileInput').files[0];
const p={id:Date.now(),name:name,grade:grade,photo:photo?photo.name:null,file:file?file.name:null,date:new Date().toLocaleDateString('ar-SA')};
participants.push(p);
save();render();showToast('✅ تم إضافة '+name);
document.getElementById('studentName').value='';
document.getElementById('gradeSelect').value='';
document.getElementById('photoLabel').textContent='اضغط لاختيار صورة 📷';
document.getElementById('fileLabel').textContent='اضغط لاختيار ملف 📎';
document.getElementById('photoInput').value='';
document.getElementById('fileInput').value='';
}

function deleteParticipant(id){
if(confirm('هل تريد حذف هذا المشارك؟')){participants=participants.filter(p=>p.id!==id);save();render()}}

function save(){localStorage.setItem('iqra_participants',JSON.stringify(participants))}

function filterWall(f,btn){
currentFilter=f;
document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
if(btn)btn.classList.add('active');
render();
}

function render(){
const grid=document.getElementById('wallGrid');
const empty=document.getElementById('emptyState');
const filtered=currentFilter==='all'?participants:participants.filter(p=>p.grade===currentFilter);
if(filtered.length===0){grid.innerHTML='<div class="empty-state" id="emptyState"><div class="icon">📚</div><p>لم يتم تسجيل أي مشارك بعد</p></div>'}else{
grid.innerHTML=filtered.map(p=>`<div class="participant-card"><div class="card-header"><span class="grade-badge">${p.grade}</span><button class="delete-btn" onclick="deleteParticipant(${p.id})">✕</button></div><div class="participant-name">${p.name}</div><div class="participant-class">📅 ${p.date}</div>${p.photo||p.file?'<div class="participant-files">'+(p.photo?'<span class="file-tag">🖼️ '+p.photo+'</span>':'')+(p.file?'<span class="file-tag">📎 '+p.file+'</span>':'')+'</div>':''}</div>`).join('')}
// Update stats
document.getElementById('totalParticipants').textContent=participants.length;
document.getElementById('totalFiles').textContent=participants.filter(p=>p.file).length;
document.getElementById('totalImages').textContent=participants.filter(p=>p.photo).length;
const counts={};participants.forEach(p=>{counts[p.grade]=(counts[p.grade]||0)+1});
const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
document.getElementById('topClass').textContent=top?top[0]:'-';
}

function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}

function exportStats(){
let txt='📊 إحصائيات مسابقة إقرأ\n';
txt+='═══════════════════════\n\n';
txt+='إجمالي المشاركين: '+participants.length+'\n';
txt+='ملفات مرفوعة: '+participants.filter(p=>p.file).length+'\n';
txt+='صور مرفوعة: '+participants.filter(p=>p.photo).length+'\n\n';
txt+='توزيع حسب الصف:\n';
const counts={};participants.forEach(p=>{counts[p.grade]=(counts[p.grade]||0)+1});
Object.entries(counts).forEach(([g,c])=>{txt+=`  ${g}: ${c} مشارك\n`});
txt+='\nقائمة المشاركين:\n───────────────────\n';
participants.forEach((p,i)=>{txt+=`${i+1}. ${p.name} (${p.grade}) - ${p.date}\n`});
const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='iqra-stats.txt';a.click();
showToast('✅ تم تصدير الإحصائيات');
}

render();
</script>
</body>
</html>
